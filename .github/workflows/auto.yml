# 水生态环境知识库 · 自动采集与部署（每天 2 次深度模式）
#
# —— 调度沿革 ——
#   2026-07-26  站点停更（「常规采集」单步耗满 90 分钟被 timeout 杀掉，后续全部 skipped）
#   2026-09-18  修复：每步硬超时 + 「合并/提交/部署」改 if: always()
#   2026-09-20  发现「每小时」调度被低频重活长期挤占（近 25 次里 11 次 cancelled），
#               且把每次采集压得很短。经确认改为：**每天 2 次深度采集**（北京 09:00 / 17:00），
#               单次时间放宽、采集参数加深，追求「深度、全面、高质量」而非频次。
#
# —— 分工（彼此错峰，避免同时改写 kb/inbox.json）——
#   auto.yml    北京 09:00 / 17:00   深度采集(5 源) + 媒体回填 + 坏链自查 + 体积治理 + 合并部署
#   sites.yml   北京 11:00           多站点栏目深翻页 + 原文巡检 + 原文审查
#   refill.yml  北京 12:30           全库原文分级回填（1000 条/次）
#   bulk.yml    手动                 一次性大批量灌入
name: 自动采集与部署

on:
  schedule:
    - cron: '0 1,9 * * *'    # UTC 01:00 / 09:00 = 北京 09:00 / 17:00
  workflow_dispatch:
    inputs:
      intensity:
        description: '采集强度: deep(默认,深度) / light(轻量,应急)'
        required: false
        default: 'deep'

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: water-eco-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install --quiet requests beautifulsoup4 pypdf

      # —— 主采集：五路来源铺开，参数按「深度」配置 ——
      - name: 深度采集（政策库 / 学术 / 微信 / Crossref / EuropePMC）
        timeout-minutes: 35
        continue-on-error: true
        env:
          PAGES: '8'
          GOV_PAGES: '8'
          FETCH_IMAGES: '1'
          FETCH_PDF: '1'
          OA_MAIL: 'water-eco-bot@users.noreply.github.com'
        run: |
          timeout 400 python3 crawl_gov.py       || echo "crawl_gov failed/timeout, skip"
          timeout 400 python3 crawl_academic.py  || echo "crawl_academic failed/timeout, skip"
          timeout 400 python3 crawl_weixin.py    || echo "crawl_weixin failed/timeout, skip"
          timeout 400 python3 crawl_crossref.py  || echo "crawl_crossref failed/timeout, skip"
          timeout 400 python3 crawl_europepmc.py || echo "crawl_europepmc failed/timeout, skip"

      # —— 配图/媒体回填（让详情页有图可看）——
      - name: 存量媒体回填（配图优先）
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        env:
          BATCH: '120'
          FETCH_IMAGES: '1'
          FETCH_PDF: '1'
          OA_MAIL: 'water-eco-bot@users.noreply.github.com'
        run: timeout 540 python3 refetch_media.py || echo "refetch_media failed/timeout, skip"

      # —— 质量闸门 1：坏链自查（编造链/繁体链/英文版链/首页占位链）——
      - name: 坏链自查修正
        if: always()
        timeout-minutes: 12
        continue-on-error: true
        run: timeout 660 python3 fix_bad_urls.py --kb kb/kb.json --std std_index.json || echo "url fix skipped"

      # —— 质量闸门 2：仓库体积治理（守住 Pages 1GB 站点上限）——
      - name: 仓库体积治理（PDF 分级保留 + 清历史快照）
        if: always()
        timeout-minutes: 13
        continue-on-error: true
        run: timeout 720 python3 prune_repo.py || echo "prune skipped"

      # —— 以下步骤用 if: always()：采集异常也必须重建并部署站点，杜绝「静默停更」 ——
      - name: 合并 / 归一化 / 富化 / 渲染
        if: always()
        timeout-minutes: 20
        run: python3 update.py || echo "update failed, continue to commit what we have"

      - name: 提交入库数据（safe_push：并发推送自动重试，绝不阻断部署）
        if: always()
        continue-on-error: true
        run: bash safe_push.sh auto

      - name: 配置 Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: 准备站点产物（剔除 .git，避免 Pages artifact 打进仓库历史）
        if: always()
        run: |
          rm -rf _site && mkdir -p _site
          tar -cf - --exclude=./.git --exclude=./_site . | (cd _site && tar -xf -)

      - name: 上传站点产物
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署到 GitHub Pages
        id: deployment
        if: always()
        uses: actions/deploy-pages@v4

      - name: 失败告警（自动开 Issue，避免静默停更）
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ WaterEco 自动采集/部署工作流失败';
            const body = '自动采集或部署在 ' + new Date().toISOString() + ' (UTC) 失败。\n'
                       + '请到 Actions 页查看最近一次运行日志并修复，避免知识库停更。\n'
                       + '常见原因：爬虫被限流/改版、update.py 异常、Pages 配额或仓库过大。';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 30
            });
            if (!issues.data.find(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body
              });
            }

      - name: 成功后关闭告警 Issue
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ WaterEco 自动采集/部署工作流失败';
            const iss = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 30
            });
            for (const i of iss.data.filter(i => i.title === title)) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number, state: 'closed'
              });
            }
