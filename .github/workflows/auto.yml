# 水生态环境知识库 · 自动采集与部署
# 每小时 / 每日自动采集水生态环境知识：抓取原文全文 + 政策/研究配图 + 学术开放获取PDF，
# 去重入库并部署到 GitHub Pages 固定链接（实时更新）。
#
# 设计要点（防止“自动化停摆”）：
#  1) 每日任务“无论如何都提交一次心跳(last_run.txt)”，保证仓库每天有提交 ->
#     既让调度对 GitHub 保持活跃（避免 60 天无活动被自动禁用定时任务），也让停更可被一眼发现。
#  2) 存量媒体回填(refetch_media)设为 continue-on-error 且增量落盘，单步慢/超时不会拖垮“采集+部署”主流程。
#  3) 每日深度采集批量从 PAGES=12 降到 6、回填 BATCH 从 400 降到 150，确保 90 分钟内跑完，
#     避免超过 job 超时(被杀死 -> 永远来不及提交)。
#  4) 失败自动开 Issue 告警（permissions: issues: write），停更不再“静默”。
#  5) concurrency 取消 cancel-in-progress，避免运行中任务被新触发取消导致数据丢失。
name: 自动采集与部署

on:
  schedule:
    - cron: '17 * * * *'        # 每小时第 17 分钟（UTC）常规采集
    - cron: '23 8 * * *'        # 每日 08:23（UTC）深度采集 + 存量媒体回填
  workflow_dispatch:
    inputs:
      intensity:
        description: '采集强度: hourly(常规) / daily(深度)'
        required: false
        default: 'hourly'

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: water-eco-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install --quiet requests beautifulsoup4

      # —— 每小时 / 手动常规采集（批量适中：开源文献 PAGES=4）——
      - name: 常规采集（每小时）
        if: ${{ github.event.schedule == '17 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.intensity != 'daily') }}
        env:
          PAGES: '4'
          GOV_PAGES: '3'
          FETCH_IMAGES: '1'
          FETCH_PDF: '1'
          OA_MAIL: 'water-eco-bot@users.noreply.github.com'
        run: |
          python3 crawl_gov.py || echo "crawl_gov failed, skip"
          python3 crawl_academic.py || echo "crawl_academic failed, skip"
          python3 crawl_weixin.py || echo "crawl_weixin failed, skip"
          PAGES=4 python3 crawl_crossref.py || echo "crawl_crossref failed, skip"
          PAGES=4 python3 crawl_europepmc.py || echo "crawl_europepmc failed, skip"

      # —— 每日深度采集（批量适中：开源文献 PAGES=6，确保 90 分钟内跑完）——
      - name: 深度采集（每日）
        if: ${{ github.event.schedule == '23 8 * * *' || (github.event_name == 'workflow_dispatch' && inputs.intensity == 'daily') }}
        env:
          PAGES: '6'
          GOV_PAGES: '6'
          FETCH_IMAGES: '1'
          FETCH_PDF: '1'
          OA_MAIL: 'water-eco-bot@users.noreply.github.com'
        run: |
          python3 crawl_gov.py || echo "crawl_gov failed, skip"
          python3 crawl_academic.py || echo "crawl_academic failed, skip"
          python3 crawl_weixin.py || echo "crawl_weixin failed, skip"
          PAGES=6 python3 crawl_crossref.py || echo "crawl_crossref failed, skip"
          PAGES=6 python3 crawl_europepmc.py || echo "crawl_europepmc failed, skip"

      # —— 存量媒体回填（每日；可续跑、失败不阻断主流程）——
      - name: 存量媒体回填（每日，可续跑）
        if: ${{ github.event.schedule == '23 8 * * *' || (github.event_name == 'workflow_dispatch' && inputs.intensity == 'daily') }}
        continue-on-error: true
        env:
          BATCH: '150'
          FETCH_IMAGES: '1'
          FETCH_PDF: '1'
          OA_MAIL: 'water-eco-bot@users.noreply.github.com'
        run: python3 refetch_media.py || echo "refetch_media failed, skip"

      - name: 合并 / 归一化 / 富化 / 渲染
        run: python3 update.py

      - name: 提交入库数据（每日必提交心跳，保持仓库活跃且停更可被察觉）
        run: |
          git config user.email "bot@water-eco.local"
          git config user.name "WaterEco Bot"
          date +%FT%T%z > last_run.txt
          git add -A
          if git diff --cached --quiet; then
            echo "无新增知识"
            if [ "${{ github.event.schedule }}" = "23 8 * * *" ] || [ "${{ inputs.intensity }}" = "daily" ]; then
              git commit -m "auto: 心跳 $(date +%F-%H:%M) UTC（无新增知识）" && git push
            fi
          else
            git commit -m "auto: 自动采集 $(date +%F-%H:%M) UTC" && git push
          fi

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 失败告警（自动开 Issue 通知，避免静默停更）
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ WaterEco 自动采集/部署工作流失败';
            const body = '自动采集或部署在 ' + new Date().toISOString() + ' (UTC) 失败。\n'
                       + '请到 Actions 页查看最近一次运行日志并修复，避免知识库停更。\n'
                       + '常见原因：爬虫被限流/改版、update.py 异常、Pages 配额或仓库过大。';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 30
            });
            if (!issues.data.find(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body
              });
            }
